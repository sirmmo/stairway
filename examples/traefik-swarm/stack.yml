# docker stack deploy -c stack.yml stairway-edge
version: "3.8"

services:
  edge:
    image: nginx:1.27-alpine
    configs:
      - source: stairway_edge_conf_v1
        target: /etc/nginx/conf.d/default.conf
    networks:
      - traefik-public
    deploy:
      placement:
        # stairway listens on this node's docker_gwbridge gateway, so the edge must run here too
        constraints:
          - node.hostname == my-docker-host
      labels:
        traefik.enable: "true"
        traefik.docker.network: traefik-public
        traefik.http.routers.stairway.entrypoints: websecure
        traefik.http.routers.stairway.rule: Host(`stairway.example.org`)
        traefik.http.routers.stairway.tls.certresolver: basic
        traefik.http.services.stairway.loadbalancer.server.port: "80"

configs:
  stairway_edge_conf_v1:
    file: ./nginx.conf

networks:
  traefik-public:
    external: true
