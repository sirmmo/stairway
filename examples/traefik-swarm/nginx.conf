# Traefik terminates TLS for stairway.example.org and hands it to this nginx,
# which forwards to stairway on the host (bound to the docker_gwbridge gateway, not the public IP).
map $http_upgrade $connection_upgrade {
  default upgrade;
  ''      close;
}

server {
  listen 80 default_server;
  client_max_body_size 2g;   # VS Code uploads

  location / {
    proxy_pass http://172.18.0.1:8765;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header Upgrade $http_upgrade;          # VS Code websockets
    proxy_set_header Connection $connection_upgrade;
    proxy_set_header X-Real-IP $http_cf_connecting_ip;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
    proxy_request_buffering off;
    proxy_buffering off;
    proxy_read_timeout 1h;
    proxy_send_timeout 1h;
  }
}
